# ==============================================================================
#  PrisonCore - Server menu
#  Apply changes with /prisoncore reload. Players get the compass back automatically.
# 
#  THE COMPASS
#   Every player gets it in hotbar slot "slot" (1-9). It can't be dropped, moved, stored or
#   lost on death. Right-click it (or click it in the inventory) to open the "opens" menu.
#   Set enabled: false to remove it from everyone. /servermenu (or /menu) also opens the menu.
#   If the compass's slot is taken, that item moves to a free slot. If the inventory is full,
#   nothing is dropped: the player is asked to free a slot and gets the compass after that.
#   Don't make COMPASS sellable in your shop plugin: the menu compass is a compass too.
# 
#  MENU OPTIONS (under menus.<menu>)
#   title, rows (1-6), filler, items
#   permission:         players need it to open this menu at all
#   command: true       allow opening it directly with /menu <name> (main always can)
# 
#  MENU ITEMS (under menus.<menu>.items.<any name>)
#   slot: 13            or  slots: [12, 13, 14]     (0 = top left, rows of 9)
#   material, name, lore, glow, model-data, amount, skull: viewer  (same as ranks-menu.yml)
#   permission:         only players with it can use the item
#   locked:             how the item looks without the permission (leave out to hide it):
#                         material/name/lore like above, plus message: shown when clicked
#   close: true/false   close the menu when clicked (default: true unless it opens a menu)
#   actions:            run in order when clicked:
#     - '[player] spawn'          command run by the player (needs their own permission)
#     - '[console] give {player} diamond 1'   command run by the console
#     - '[menu] warps'            open another menu from this file
#     - '[close]'                 close the menu
#     - '[message] &aHello!'      send a chat message
#     - '[sound] ENTITY_PLAYER_LEVELUP'
#   {player} is replaced with the player's name. Text supports &codes, &#hex,
#   <gradient:#A:#B>..</gradient>, <smallcaps>..</smallcaps> and PlaceholderAPI.
# 
#  Commands below are common defaults (EssentialsX, EconomyShopGUI, ...). Change them to
#  the commands your plugins actually use.
#  Mine warps use per-warp permissions (essentials.warps.a ...). EssentialsX needs
#  per-warp-permission: true in its config.yml for those to apply.
# ==============================================================================
compass:
  enabled: true
  slot: 9
  opens: main
  material: COMPASS
  glow: true
  name: '<gradient:#FFD700:#FFFFFF>&lServer Menu</gradient> &7(Right-click)'
  lore:
    - '&7Warps, kits, shop, ranks and more.'

sounds:
  open: BLOCK_CHEST_OPEN
  click: UI_BUTTON_CLICK
  locked: BLOCK_NOTE_BLOCK_BASS

messages:
  locked: '&cYou haven''t unlocked this yet.'
  inventory-full: '&eFree up one inventory slot to get your server menu compass back.'

menus:
  main:
    title: '<gradient:#FFD700:#FFFFFF>&lClassic Prison</gradient>'
    rows: 5
    filler:
