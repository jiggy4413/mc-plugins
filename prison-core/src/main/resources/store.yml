# ==============================================================================
#  PrisonCore store menu  (/buy)
#  Replaces Tebex's /buy menu with this one. Players still pay on the Tebex website: clicking a
#  package closes the menu and sends a link they can click to open it.
#  Apply changes with /prisoncore reload.
#
#  Each item under a page's "items:" can use:
#    slot          where it goes. 5 rows = slots 0-44, left to right, top to bottom
#    material, name, lore, glow, texture (player head texture)
#    package       the Tebex package ID. With tebex.public-token set, {price} shows the live price
#                  from your store (sales included), and clicking opens that package's page.
#    price         text for {price} when there's no package ID (or prices haven't loaded)
#    link          what clicking opens: a full https:// link, or a path added to store-url
#                  (e.g. "category/ranks" or "package/1234567"). Leave it "" for the store's front page.
#    open          open another page of this menu instead (e.g. open: ranks)
#  Finding a package ID: open the package on your store website; the number at the end of the
#  address is its ID (e.g. .../package/1234567). Or see the package list in the Tebex panel.
#  Formatting: & codes, &#RRGGBB, <gradient:#FF0000:#FFD700>text</gradient>, <smallcaps>
# ==============================================================================

# Your Tebex store's address.
store-url: "https://classicprisonstore.tebex.io"

# Live prices from Tebex. Paste your store's PUBLIC token here: Tebex creator panel ->
# Integrations -> API Keys -> "Public Token". (Never the secret key; the public token can only
# read your listings.) Prices reload every refresh-minutes, or right away with /prisonstore refresh.
tebex:
  public-token: ""
  refresh-minutes: 10
  # How {price} looks. {old} is the price before a sale.
  price-format: "{price}"
  sale-format: "&8&m{old}&r &a{price} &c&lSALE"
  # Shown when a package's price isn't known.
  price-unknown: "See store"

# Commands that open this menu instead of Tebex's. /prisonstore always works too.
open-commands: [buy, store]

# The chat message sent when a package is clicked. Lines with {url} or {click} can be clicked.
link-message:
  - ""
  - "<gradient:#FFAA00:#FFFF55>&lClassic Prison Store</gradient>"
  - "&7Click below to get &f{package}&7:"
  - "&e&n{url}"
  - ""

# The edge of every page alternates between these, and the middle is filled with "filler".
decoration:
  border: [ORANGE_STAINED_GLASS_PANE, YELLOW_STAINED_GLASS_PANE]
  filler: BLACK_STAINED_GLASS_PANE

buttons:
  back:
    slot: 36
    material: ARROW
    name: "&7Back"
  close:
    slot: 40
    material: BARRIER
    name: "&cClose"

sounds:
  open: BLOCK_CHEST_OPEN
  click: UI_BUTTON_CLICK

