# ==============================================================================
#  PrisonCore warps menu  (/warps)
#  Apply changes with /prisoncore reload. Test the setup with /prisonwarps check.
#
#  Clicking a warp runs "/warp <name>" as the player, so EssentialsX still does the
#  teleport: its permissions, teleport delay and cooldowns all apply as usual.
#
#  The menu has pages under "menus:". /warps opens "main"; an entry with "open: mines" opens the
#  "mines" page. Pages other than main get a back button (set "back:" to choose where it goes).
#  /prisonwarps <page> opens a page directly, e.g. /prisonwarps mines
#
#  Each entry under a page's "warps:" can use:
#    slot:        where it goes. 6 rows = slots 0-53, left to right, top to bottom
#    warp:        the Essentials warp name (defaults to the entry's name). For a lettered
#                 mine, PrisonCore also tries a, amine, a-mine, a_mine, minea, mine-a, mine_a,
#                 so it finds your warp whichever way you named it
#    command:     run this command instead of a warp (no slash), e.g. spawn
#    open:        open another page of this menu instead of warping
#    mine:        the PrisonCore mine to show live stats for (defaults to the entry's name)
#    rank:        the Rankup rank needed, shown on the locked icon
#    permission:  a permission that unlocks it (see lock-by below)
#    display:     name to show (defaults to the mine's display name from mines.yml)
#    icon:        item to show (defaults to the block the mine has most of)
#    item:        change any part of the unlocked look just for this warp (material, name, lore, glow)
#    locked-item: same, for the locked look
#  Warps that don't exist in Essentials are hidden (and listed by /prisonwarps check).
#
#  Placeholders in names and lore:
#    {name} {rank} {warp} {player} {requirement}
#    {mined} {remaining} {until} {resetat} {status} {timer} {bar}   (live mine stats)
#  Formatting: & codes, &#RRGGBB, <gradient:#FF0000:#FFD700>text</gradient>, <smallcaps>, PlaceholderAPI
# ==============================================================================

# Commands that open this menu instead of Essentials' text list. "/warps 2" still goes to Essentials.
# /prisonwarps (/pwarps) always works too.
open-commands: [warps]
# Also open the menu when a player types /warp with no warp name.
open-on-bare-warp: true

# How often open menus update the live mine stats.
refresh-seconds: 1
# Show A-Mine as 1 item, B-Mine as 2 ... Z-Mine as 26.
numbered-icons: true

# What locks a warp:
#   auto        the entry's permission if it has one; otherwise essentials.warps.<warp> when
#               Essentials' per-warp-permission is on; otherwise the entry's rank
#   permission  only permissions
#   rank        only Rankup ranks (the player must have reached the rank)
#   none        nothing is locked in the menu (Essentials still checks when they click)
lock-by: auto

templates:
  mine:
    material: "{icon}"
    name: "{name}"
    lore:
      - "&7Mined: &f{mined}% {bar}"
      - "&7Status: {status}"
      - "&7Resets in: &f{timer}"
      - ""
      - "&eClick to teleport"
  mine-locked:
    material: RED_STAINED_GLASS_PANE
    name: "{name} &8(Locked)"
    lore:
      - "{requirement}"
  page:
    material: "{icon}"
    name: "{name}"
    lore:
      - ""
      - "&eClick to open"
  page-locked:
    material: IRON_BARS
    name: "{name} &8(Locked)"
    lore:
      - "{requirement}"
  other:
    material: "{icon}"
    name: "{name}"
    lore:
      - ""
      - "&eClick to teleport"
  other-locked:
    material: IRON_BARS
    name: "{name} &8(Locked)"
    lore:
      - "{requirement}"

text:
  need-rank: "&7Reach rank &f{rank} &7to unlock."
  no-access: "&7You can't use this warp yet."

menus:
  main:
    title: "<gradient:#FFAA00:#FFFF55>&lWarps</gradient>"
    rows: 3
    warps:
      mines:
        slot: 10
        open: mines
        display: "<gradient:#FFAA00:#FFFF55>&lMines</gradient>"
        icon: DIAMOND_PICKAXE
      crates:
        slot: 12
        display: "&d&lCrates"
        icon: TRIPWIRE_HOOK
      free:
        slot: 16
        display: "&6&lFree"
        icon: CHEST
      spawn:
        slot: 13
        command: spawn
        display: "&a&lSpawn"
        icon: COMPASS
      blackmarket:
        slot: 14
        display: "&8&lBlack Market"
        icon: ENDER_CHEST
      fishing:
        slot: 15
        display: "&b&lFishing"
        icon: FISHING_ROD
      # hidden until you /setwarp cells
      cells:
        slot: 11
        display: "&e&lCells"
        icon: IRON_DOOR
    buttons:
      close:
        slot: 22
        material: BARRIER
        name: "&cClose"

  mines:
    title: "<gradient:#FFAA00:#FFFF55>&lMines</gradient>"
    rows: 6
    back: main
    warps:
      amine: {slot: 10, rank: A}
      bmine: {slot: 11, rank: B}
      cmine: {slot: 12, rank: C}
      dmine: {slot: 13, rank: D}
      emine: {slot: 14, rank: E}
      fmine: {slot: 15, rank: F}
      gmine: {slot: 16, rank: G}
      hmine: {slot: 19, rank: H}
      imine: {slot: 20, rank: I}
      jmine: {slot: 21, rank: J}
      kmine: {slot: 22, rank: K}
      l: {slot: 23, rank: L}
      m: {slot: 24, rank: M}
      n: {slot: 25, rank: N}
      o: {slot: 28, rank: O}
      p: {slot: 29, rank: P}
      q: {slot: 30, rank: Q}
      r: {slot: 31, rank: R}
      s: {slot: 32, rank: S}
      t: {slot: 33, rank: T}
      u: {slot: 34, rank: U}
      v: {slot: 37, rank: V}
      w: {slot: 38, rank: W}
      x: {slot: 39, rank: X}
      y: {slot: 40, rank: Y}
      z: {slot: 41, rank: Z}

filler:
  material: BLACK_STAINED_GLASS_PANE
  name: " "

# Buttons every page uses unless the page has its own "buttons:".
buttons:
  close:
    slot: 53
    material: BARRIER
    name: "&cClose"
  back:
    slot: 45
    material: ARROW
    name: "&7Back"

sounds:
  open: BLOCK_CHEST_OPEN
  teleport: ENTITY_ENDERMAN_TELEPORT
  locked: ENTITY_VILLAGER_NO

messages:
  locked-rank: "&cYou need rank &f{rank} &cto use this warp."
  locked: "&cYou can't use this warp yet."
