# ==============================================================================
#  PrisonCore enchants
#  Players open the menu by right-clicking an enchanting table, or with /enchanter.
#  Pickaxe enchants cost Tokens (found while mining). Sword and armor enchants cost PvP points
#  (1 per kill). Apply changes with /prisoncore reload.
#
#  Each enchant:
#    name          what players see
#    vanilla       a normal Minecraft enchant to use (efficiency, sharpness...). Leave it out
#                  for prison enchants, which PrisonCore handles itself.
#    costs         the price of each level, level 1 first. The number of prices is the max level,
#                  so add or remove lines to change how high it goes.
#                  (Instead of costs you can use cost + cost-growth + max-level for a fixed
#                  % increase per level.)
#    strength      for prison enchants: how strong each level is, level 1 first (see each
#                  description). Use "per-level: 2" instead for the same increase every level.
#    only-for      limit to some items, e.g. [BOOTS]
#    slot          where it sits on its Enchanter page (5 rows = slots 0-44, left to right, top to
#                  bottom). Enchants without a slot fill the free spots in rows 3 and 4 in the order
#                  they're listed. Slots 3, 5, 13, 36 and 40 are the balances, item, back and close.
#    in-menu       false = crate-only: not sold in the Enchanter, only added by staff with
#                  /enchanter apply <enchant> <level> (for crate rewards). Its levels come from
#                  "strength:", and it has no costs.
#    icon          item shown in the menu
#  Set enabled: false on an enchant to hide it.
# ==============================================================================

# Right-clicking an enchanting table opens this menu instead of the normal one.
replace-enchanting-table: true

# How enchants are listed on the item (normal Minecraft enchant names are hidden so levels
# above 10 don't show as "enchantment.level.11").
lore-format: "&7{name} {level}"
# Show levels as Roman numerals like vanilla (Efficiency X). false = plain numbers (Efficiency 10).
roman-numerals: true

# Fortune is Minecraft's own Fortune. To use PrisonCore's version instead (more of EVERY block
# mined in a mine), remove "vanilla: fortune" from it and add e.g. "per-level: 2" (% per level).
# That version only works inside PrisonCore mines when this is true:
fortune-only-in-mines: true
# Explosive breaks a cube this many blocks out from the mined block (1 = 3x3x3).
explosive-radius: 1
# Ores blown up by Explosive come out smelted (iron ore -> iron ingot, gold ore -> gold ingot).
explosive-auto-smelt: true
# Fortune and Explosive put blocks straight into the inventory. When it's full, drop the rest
# on the ground (true) or lose them (false, which avoids lag from piles of items).
drop-when-inventory-full: false

currency:
  tokens: "&eTokens"
  pvp-points: "&cPvP Points"

menu:
  title: "<gradient:#FFAA00:#FFFF55>&lEnchanter</gradient>"
  armor-title: "<gradient:#FFAA00:#FFFF55>&lArmor</gradient>"
  item-title: "<gradient:#FFAA00:#FFFF55>&lUpgrade {item}</gradient>"

messages:
  inventory-full: "&cYour inventory is full!"

# Extra settings for some prison enchants.
enchant-settings:
  key-finder:
    # After finding a key, no more keys for this long, and never more than max-per-day keys a day,
    # so fast pickaxes can't farm keys. (Explosive blocks never find keys.)
    cooldown-minutes: 15
    max-per-day: 6
    # The console command that gives each level's key. Test them in the console first and
    # use your crate names from SpecializedCrates.
    commands:
      - "scrates givekey {player} ClassicCrate 1"
      - "scrates givekey {player} MegaCrate 1"
      - "scrates givekey {player} LegendaryCrate 1"
    key-names: ["&7a Classic Key", "&da Mega Key", "&6a Legendary Key"]
    message: "&6&lKEY FINDER! &7You found {key}&7!"
  money-finder:
    # % chance per block mined (in a mine) to find money.
    chance-percent: 0.5
  bleed:
    damage-per-second: 1
    seconds: 3
  freeze:
    # also works on bows: arrows that hit can slow the target
    seconds: 2
  executioner:
    below-health-percent: 30
  thunder:
    bonus-damage: 3
  bounty-hunter:
    # No tokens for killing the same player again within this many seconds.
    same-player-cooldown-seconds: 300
  swiftness:
    speed-level: 2
    seconds: 3
  armor-pierce:
    message: "&b&lARMOR PIERCED!"
  ender-shot:
    # Only arrows shot while sneaking teleport you, so normal shots stay normal.
    only-while-sneaking: true
    cooldown-seconds: 10
  last-stand:
    below-health-percent: 25
    cooldown-seconds: 60

enchants:
