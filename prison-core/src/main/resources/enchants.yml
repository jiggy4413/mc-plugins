        - 750        # level 2
        - 1125       # level 3
        - 1688       # level 4
        - 2531       # level 5
        - 3797       # level 6
        - 5695       # level 7
        - 8543       # level 8
        - 12814      # level 9
        - 19222      # level 10

    fortune:
