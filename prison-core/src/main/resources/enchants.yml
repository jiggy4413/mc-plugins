        - 0.025      # level 3
      icon: TRIPWIRE_HOOK
      description: ["Rare chance to find a crate key while mining.", "Level 1: Classic key. Level 2: Mega key.", "Level 3: Legendary key.", "At most one key every 15 minutes, 6 a day."]
      costs:
