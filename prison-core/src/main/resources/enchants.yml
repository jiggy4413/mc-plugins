# ==============================================================================
#  PrisonCore enchants
#  Players open the menu by right-clicking an enchanting table, or with /enchanter.
#  Pickaxe enchants cost Tokens (found while mining). Sword and armor enchants cost PvP points
#  (1 per kill). Apply changes with /prisoncore reload.
#
#  Each enchant:
#    name          what players see
#    vanilla       a normal Minecraft enchant to use (efficiency, sharpness...). Leave it out
#                  for prison enchants, which PrisonCore handles itself.
#    costs         the price of each level, level 1 first. The number of prices is the max level,
#                  so add or remove lines to change how high it goes.
#                  (Instead of costs you can use cost + cost-growth + max-level for a fixed
#                  % increase per level.)
#    per-level     strength per level, for prison enchants (see each description)
#    only-for      limit to some items, e.g. [BOOTS]
#    icon          item shown in the menu
#  Set enabled: false on an enchant to hide it.
# ==============================================================================

# Right-clicking an enchanting table opens this menu instead of the normal one.
replace-enchanting-table: true

# How enchants are listed on the item (normal Minecraft enchant names are hidden so levels
# above 10 don't show as "enchantment.level.11").
lore-format: "&7{name} &f{level}"

# Fortune is Minecraft's own Fortune. To use PrisonCore's version instead (more of EVERY block
# mined in a mine), remove "vanilla: fortune" from it and add e.g. "per-level: 2" (% per level).
# That version only works inside PrisonCore mines when this is true:
fortune-only-in-mines: true
# Explosive breaks a cube this many blocks out from the mined block (1 = 3x3x3).
explosive-radius: 1
# Fortune and Explosive put blocks straight into the inventory. When it's full, drop the rest
# on the ground (true) or lose them (false, which avoids lag from piles of items).
drop-when-inventory-full: false

currency:
  tokens: "&eTokens"
  pvp-points: "&cPvP Points"

menu:
  title: "<gradient:#FFAA00:#FFFF55>&lEnchanter</gradient>"
  armor-title: "<gradient:#FFAA00:#FFFF55>&lArmor</gradient>"
  item-title: "<gradient:#FFAA00:#FFFF55>&lUpgrade {item}</gradient>"

messages:
  inventory-full: "&cYour inventory is full!"

enchants:
  pickaxe:
    efficiency:
      name: Efficiency
      vanilla: efficiency
      icon: SUGAR
      description: ["Mine faster.", "Level 6 is one past normal Minecraft."]
      costs:
        - 500        # level 1
        - 750        # level 2
        - 1125       # level 3
        - 1688       # level 4
        - 2531       # level 5
        - 3797       # level 6
    fortune:
      name: Fortune
      vanilla: fortune
      icon: DIAMOND
      description: ["Minecraft's Fortune: more drops from", "coal, diamond, emerald, redstone and lapis ore."]
      costs:
        - 2000       # level 1
        - 8000       # level 2
        - 25000      # level 3
    unbreaking:
      name: Unbreaking
      vanilla: unbreaking
      icon: ANVIL
      description: ["Your pickaxe lasts longer."]
      costs:
        - 15         # level 1
        - 20         # level 2
        - 26         # level 3
    mending:
      name: Mending
      vanilla: mending
      icon: EXPERIENCE_BOTTLE
      description: ["XP repairs your pickaxe."]
      costs:
        - 2500       # level 1
    token-finder:
      name: Token Finder
      per-level: 40
      icon: SUNFLOWER
      description: ["Find tokens more often.", "+40% chance per level (x3 at level 5)."]
      costs:
        - 500        # level 1
        - 1500       # level 2
        - 4000       # level 3
        - 10000      # level 4
        - 25000      # level 5
    explosive:
      name: Explosive
      per-level: 2
      icon: TNT
      description: ["Chance to blow up the blocks", "around the one you mine.", "2% per level (10% at level 5)."]
      costs:
        - 1000       # level 1
        - 3000       # level 2
        - 8000       # level 3
        - 20000      # level 4
        - 50000      # level 5

  sword:
    sharpness:
      name: Sharpness
      vanilla: sharpness
      icon: IRON_SWORD
      description: ["More damage.", "Level 6 is one past normal Minecraft."]
      costs:
        - 2          # level 1
        - 3          # level 2
        - 4          # level 3
        - 5          # level 4
        - 7          # level 5
        - 9          # level 6
    fire-aspect:
      name: Fire Aspect
      vanilla: fire_aspect
      icon: BLAZE_POWDER
      description: ["Sets your target on fire."]
      costs:
        - 15         # level 1
        - 30         # level 2
    knockback:
      name: Knockback
      vanilla: knockback
      icon: PISTON
      description: ["Knocks your target back."]
      costs:
        - 10         # level 1
        - 20         # level 2
    unbreaking:
      name: Unbreaking
      vanilla: unbreaking
      icon: ANVIL
      description: ["Your sword lasts longer."]
      costs:
        - 3          # level 1
        - 4          # level 2
        - 5          # level 3
    mending:
      name: Mending
      vanilla: mending
      icon: EXPERIENCE_BOTTLE
      description: ["XP repairs your sword."]
      costs:
        - 25         # level 1

  armor:
    protection:
      name: Protection
      vanilla: protection
      icon: SHIELD
      description: ["Take less damage.", "Level 6 is one past normal Minecraft."]
      costs:
        - 3          # level 1
        - 4          # level 2
        - 7          # level 3
        - 10         # level 4
        - 15         # level 5
        - 23         # level 6
    fire-protection:
      name: Fire Protection
      vanilla: fire_protection
      icon: MAGMA_CREAM
      description: ["Take less fire and lava damage.", "Level 6 is two past normal Minecraft."]
      costs:
        - 3          # level 1
        - 4          # level 2
        - 7          # level 3
        - 10         # level 4
        - 15         # level 5
        - 23         # level 6
    blast-protection:
      name: Blast Protection
      vanilla: blast_protection
      icon: TNT
      description: ["Take less explosion damage.", "Level 6 is two past normal Minecraft."]
      costs:
        - 3          # level 1
        - 4          # level 2
        - 7          # level 3
        - 10         # level 4
        - 15         # level 5
        - 23         # level 6
    thorns:
      name: Thorns
      vanilla: thorns
      icon: CACTUS
