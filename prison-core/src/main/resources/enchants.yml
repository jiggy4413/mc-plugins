      strength:
        - 1          # level 1: about every 100 blocks
        - 10         # level 2: about every 10 blocks
      icon: TNT
      description: ["Chance to blow up the blocks", "around the one you mine.", "Level 1: about every 100 blocks.", "Level 2: about every 10 blocks."]
      costs:
