name: PrisonCore
version: ${project.version}
main: io.github.jiggy4413.prisoncore.PrisonCore
api-version: '1.21'
author: jiggy4413
description: Custom features for the prison server - ranks menu, warps menu, help, scoreboard, tokens, mines, void worlds.
# Load after these so we can hook into them. Neither is required.
softdepend: [Rankup, PlaceholderAPI]
# Enable before Multiverse so worlds using PrisonCore's void generator can load at startup.
loadbefore: [Multiverse-Core]

commands:
  prisoncore:
    description: PrisonCore info and admin commands.
    usage: /prisoncore [reload | give <player> <item> [amount] | debug totems]
    aliases: [pcore]
  pmine:
    description: Set up and manage PrisonCore mines.
    usage: /pmine <list|info|pos1|pos2|setregion|setspawn|reset|import>
    aliases: [pmines, prisonmine]
    permission: prisoncore.mines.admin
  prisonwarps:
    description: Opens the warps menu. /prisonwarps check shows how each warp is set up.
    usage: /prisonwarps [check]
    aliases: [pwarps]
    permission: prisoncore.warps
  prisonhelp:
    description: Shows the server's help.
    usage: /prisonhelp [page]
    permission: prisoncore.help
  tokens:
    description: Check, pay and manage tokens.
    usage: /tokens [player] | pay <player> <amount> | top | give|take|set <player> <amount>
    aliases: [token]
    permission: prisoncore.tokens
  pvppoints:
    description: Check and manage PvP points.
    usage: /pvppoints [player] | give|take|set <player> <amount>
    aliases: [pvppoint]
    permission: prisoncore.tokens
  prisonenchants:
    description: Opens the enchant menu. Staff can apply enchants to the held item.
    usage: /enchanter | apply <enchant> <level> [player] | remove <enchant> [player]
    aliases: [enchanter, upgrades]
    permission: prisoncore.enchants
  prisonstore:
    description: Opens the store menu.
    usage: /prisonstore [page]
    permission: prisoncore.store
  prisonboard:
    description: Turns your scoreboard on or off.
    usage: /board [on|off]
    aliases: [board, sb]
    permission: prisoncore.board
  prisonranks:
    description: Opens the ranks menu.
    usage: /prisonranks [prestiges]
    permission: prisoncore.ranks

permissions:
  prisoncore.mines.admin:
    description: Use /pmine to set up and reset mines.
    default: op
  prisoncore.admin:
    description: Use /prisoncore reload.
    default: op
  prisoncore.warps:
    description: Open the warps menu.
    default: true
  prisoncore.help:
    description: See the custom /help.
    default: true
  prisoncore.help.all:
    description: Use /help all to see the server's full command list.
    default: op
  prisoncore.tokens:
    description: Check and pay tokens.
    default: true
  prisoncore.tokens.admin:
    description: Give, take and set anyone's tokens (/tokens give, for Tebex and votes).
    default: op
  prisoncore.enchants:
    description: Use the enchant menu.
    default: true
  prisoncore.store:
    description: Open the store menu.
    default: true
  prisoncore.enchants.admin:
    description: Use /enchanter apply and remove to put any enchant on the held item for free.
    default: op
  prisoncore.board:
    description: Turn your own scoreboard on or off.
    default: true
  prisoncore.ranks:
    description: Open the ranks and prestiges menu.
    default: true
