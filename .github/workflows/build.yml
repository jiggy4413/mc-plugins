# Builds every plugin on each push. The newest jars are published as the
# "Latest build" release (Releases on the repo page) and also attached to
# each run under the Actions tab as "plugin-jars".
name: Build plugins

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jars
          path: '*/target/*.jar'
          if-no-files-found: error

      # On pushes to main, replace the "latest" release with the new jars,
      # so the newest build is always under Releases on the repo page.
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest */target/*.jar \
            --title "Latest build" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}. Download the jar(s) below and upload them to the server's plugins folder." \
            --target "$GITHUB_SHA" \
            --latest
