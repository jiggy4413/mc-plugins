# Builds every plugin on each push and attaches the jars to the run.
# Download them from the repo's Actions tab -> latest run -> "plugin-jars".
name: Build plugins

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jars
          path: '*/target/*.jar'
          if-no-files-found: error
