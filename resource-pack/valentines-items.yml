# Valentines collection for Classic Prison 1.21.4 (needs PrisonCore 2.7.0+ and the ClassicPrison-1.21.4 pack).
# Paste under "items:" in plugins/PrisonCore/items.yml (two-space indent), REPLACING your old Thornheart
# entries, then /prisoncore reload.  Give with: /prisoncore give <player> <name>  (or /prisoncore items)
#
# Sets: thornheart, goldthornheart, cupid, goldcupid. Each has helmet, chestplate, leggings, boots and
# sword, axe, spear, scythe, pickaxe, bow, shield (e.g. cupidspear, goldthornheartshield).
# Full set bonuses (on the chestplate, only while all 4 pieces of the SAME set are worn):
#   Thornheart: Thornguard I (10% of melee damage back)   Golden Thornheart: Thornguard II (20%)
#   Cupid: Absorption I (+2 hearts)                        Golden Cupid: Absorption II (+4 hearts)
# The spear is a melee weapon (a netherite sword underneath). Tools have no enchants yet.

  # ---- Thornheart ---- #
  thornhearthelmet:
    material: NETHERITE_HELMET
    item-model: "classicprison:thornheart_helmet"
    equipment: "model"
    set: thornheart
    show-attributes: true
    unbreakable: true
    name: "&4&lThornheart Helmet"
    lore: ["", "&6&lFULL SET BONUS", "&eThornguard I", "&7Players who hit you take 10%", "&7of the damage back.", "", "&7Wear all 4 pieces to activate.", "&7A limited Valentines Crate exclusive."]

