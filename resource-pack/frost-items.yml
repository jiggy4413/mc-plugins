    model-data: 2003
    unbreakable: true
    name: "&b&lFrost Bow"
    lore: ["&eFreeze: {freeze}% chance your arrows", "&eslow the target for 2 seconds.", "&eEnder Shot: sneak while shooting to teleport", "&ewhere the arrow lands ({ender-shot}s cooldown).", "", "&7When Fully Drawn:", "&9 6-10 Arrow Damage", "", "&7A Winter Crate exclusive."]
    enchants:
      freeze: {1: 40, 2: 30, 3: 20, 4: 10}
      ender-shot: {1: 40, 2: 30, 3: 20, 4: 10}

  frostscythe:
