# Paste under "items:" in plugins/PrisonCore/items.yml (two-space indent), replacing the old frost entries.
# Then /prisoncore reload. Needs PrisonCore 1.19.0+.
# Give with: /prisoncore give <player> frostsword (frostaxe, frostbow, frostscythe)
#        or: /prisoncore give <player> goldfrostsword (goldfrostaxe, goldfrostbow, goldfrostscythe)
# Normal versions roll each enchant at level I (70%) or II (30%). Gold versions are always level III.
# In the lore, {freeze} becomes the rolled strength (e.g. 8) and {freeze-level} the level (II).
  frostsword:
    material: NETHERITE_SWORD
    model-data: 2001
    unbreakable: true
    name: "&b&lFrost Sword"
    lore: ["&eFreeze: {freeze}% chance to slow your", "&etarget for 2 seconds.", "&eSwiftness: {swiftness}% chance to gain", "&eSpeed II for 3 seconds on hit.", "", "&7When in Main Hand:", "&9 9 Attack Damage", "", "&7A Winter Crate exclusive."]
    enchants:
      freeze: {1: 40, 2: 30, 3: 20, 4: 10}
      swiftness: {1: 40, 2: 30, 3: 20, 4: 10}

  frostaxe:
    material: NETHERITE_AXE
    model-data: 2002
    unbreakable: true
    name: "&b&lFrost Axe"
    lore: ["&eExecutioner: +{executioner}% damage to", "&etargets below 30% health.", "", "&7When in Main Hand:", "&9 8 Attack Damage", "", "&7A Winter Crate exclusive."]
    enchants:
      executioner: {1: 40, 2: 30, 3: 20, 4: 10}

  frostbow:
