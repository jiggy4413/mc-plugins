# Custom armor sets for Classic Prison 1.21.4 (needs PrisonCore 2.2.0+ and the ClassicPrison-1.21.4 pack).
# Paste these under "items:" in plugins/PrisonCore/items.yml (two-space indent), then /prisoncore reload.
# Give with: /prisoncore give <player> <name>   e.g. /prisoncore give jidot thornheartchestplate
#
# All pieces are netherite, so they have netherite armor stats (3/8/6/3, 3 toughness, knockback resistance).
# item-model = the inventory icon, equipment = how it looks when worn. Helmets use "model": the 3D helmet
# model is worn on the head. Only Winter Nova has enchants so far; the other sets are look-only for now.
# The old leather Winter/Valentines/Summer Nova entries (nova-items.yml) are replaced by these.

  # ---- Winter Nova
  winterhelmet:
    material: NETHERITE_HELMET
    item-model: "classicprison:winter_helmet"
    equipment: "model"
    unbreakable: true
    name: "&b&lWinter Nova Helmet"
    lore: ["", "&7When on Head:", "&9+3 Armor", "&9+3 Armor Toughness", "&9+1 Knockback Resistance", "", "&7A Winter Crate exclusive."]

  winterchestplate:
    material: NETHERITE_CHESTPLATE
    item-model: "classicprison:winter_chestplate"
    equipment: "classicprison:winter"
    unbreakable: true
    name: "&b&lWinter Nova Chestplate"
    lore: ["&eDodge: 9% chance to take no", "&edamage from a player's hit.", "", "&7When on Body:", "&9+8 Armor", "&9+3 Armor Toughness", "&9+1 Knockback Resistance", "", "&7A Winter Crate exclusive."]
    enchants: {dodge: 3}

  winterleggings:
    material: NETHERITE_LEGGINGS
    item-model: "classicprison:winter_leggings"
    equipment: "classicprison:winter"
    unbreakable: true
    name: "&b&lWinter Nova Leggings"
    lore: ["&eLast Stand: Strength and Resistance", "&efor 7s when you drop below 25% health.", "", "&7When on Legs:", "&9+6 Armor", "&9+3 Armor Toughness", "&9+1 Knockback Resistance", "", "&7A Winter Crate exclusive."]
    enchants: {last-stand: 3}

  winterboots:
    material: NETHERITE_BOOTS
    item-model: "classicprison:winter_boots"
    equipment: "classicprison:winter"
    unbreakable: true
    name: "&b&lWinter Nova Boots"
    lore: ["&eSpeed: permanent Speed I", "&ewhile you wear these boots.", "", "&7When on Feet:", "&9+3 Armor", "&9+3 Armor Toughness", "&9+1 Knockback Resistance", "", "&7A Winter Crate exclusive."]
    enchants: {speed: 1}

