# Custom armor sets for Classic Prison 1.21.4 (needs PrisonCore 2.3.0+ and the ClassicPrison-1.21.4 pack).
# Paste these under "items:" in plugins/PrisonCore/items.yml (two-space indent), replacing the old armor
# entries, then /prisoncore reload.  Give with: /prisoncore give <player> <name>
#
# All pieces are netherite and show their normal netherite stats in the tooltip (show-attributes: true).
# set: <id> = which set a piece belongs to. A set piece's enchants (Speed, Dodge, Last Stand) only work
# while all 4 pieces of the SAME set are worn. Only the Winter sets have bonuses so far.
# item-model = inventory icon, equipment = worn look ("model" = the 3D helmet is worn on the head).

  # ---- Winter Nova
  winterhelmet:
    material: NETHERITE_HELMET
    item-model: "classicprison:winter_helmet"
    equipment: "model"
    set: winter
    show-attributes: true
    unbreakable: true
    name: "&b&lWinter Nova Helmet"
    lore: ["", "&6&lFULL SET BONUS", "&eSpeed I", "&eDodge: 9% chance to take no damage from a player's hit", "&eLast Stand: Strength + Resistance for 7s below 25% health", "", "&7Wear all 4 pieces to activate.", "&7A Winter Crate exclusive."]

  winterchestplate:
    material: NETHERITE_CHESTPLATE
    item-model: "classicprison:winter_chestplate"
    equipment: "classicprison:winter"
    set: winter
    show-attributes: true
    unbreakable: true
    name: "&b&lWinter Nova Chestplate"
    lore: ["", "&6&lFULL SET BONUS", "&eSpeed I", "&eDodge: 9% chance to take no damage from a player's hit", "&eLast Stand: Strength + Resistance for 7s below 25% health", "", "&7Wear all 4 pieces to activate.", "&7A Winter Crate exclusive."]
    enchants: {dodge: 3}

  winterleggings:
