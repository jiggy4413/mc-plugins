# Paste under rewards: in your Winter Crate's rewards (same indent as Winter_Nova_Boots).
# Each one runs /prisoncore give, so enchant levels are rolled fresh every win.
# If your other command rewards use a different player placeholder than {name}, change it here too.

Frost_Sword:
  commands:
  - prisoncore give {name} frostsword
  chance: 2.0
  rarity: default
  linked-rewards: []
  give-display-item:
    value: false
    with-lore: true
    with-name: true
  fallback-reward:
    reward-name: ''
    permission: ''
  display-item:
    material: NETHERITE_SWORD
    glow: false
    amount: 1
    damage: 0
    name: '&b&lFrost Sword'
    lore:
    - '&7Freeze I-II'
    - '&7Swiftness I-II'
    - ''
    - '&eFreeze: 5-8% chance to slow your'
    - '&etarget for 2 seconds.'
    - '&eSwiftness: 8-12% chance to gain'
    - '&eSpeed II for 3 seconds on hit.'
    - ''
    - '&7When in Main Hand:'
    - '&9 9 Attack Damage'
    - ''
    - '&7Enchant levels are rolled when won.'
    - '&7A Winter Crate exclusive.'
    - '&7-'
    - '&eChance: &6%writtenchance%%'
    nbt-tags:
    - Unbreakable 1
    - CustomModelData 2001
    item-flags:
    - HIDE_ENCHANTS
    - HIDE_ATTRIBUTES
    - HIDE_UNBREAKABLE
    - HIDE_DESTROYS
    - HIDE_PLACED_ON
    - HIDE_POTION_EFFECTS

